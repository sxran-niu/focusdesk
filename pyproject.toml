[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusdesk"
authors = [{name = "sxran"}]
version = "0.3.0"
description = "A daily planner connecting study and life to verified long-term outcomes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4"]

[project.scripts]
focusdesk = "focusdesk.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focusdesk = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
